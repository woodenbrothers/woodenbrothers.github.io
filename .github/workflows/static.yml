# Construit le site (scripts/build.py) et le déploie sur GitHub Pages
# à chaque push sur main. Lancement manuel possible depuis l'onglet Actions.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache des photos ré-hébergées
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('data/products.json') }}
          restore-keys: images-
      - name: Préparer les photos (WebP, 3 tailles, noms descriptifs)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet -r scripts/requirements.txt
          python3 scripts/images.py
      - name: Construire le site (pages créations, collections, sitemap, llms.txt)
        run: python3 scripts/build.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Prévenir les moteurs de recherche (IndexNow)
        continue-on-error: true
        run: python3 scripts/indexnow.py _site/sitemap.xml
